<!-- partials/email-list.html — HTMX partial loaded into #email-list-inner.
     The rows themselves are the "email-rows" template defined in inbox.html. -->
<input type="hidden" name="folder" id="search-folder" value="{{.CurrentFolder}}" hx-swap-oob="true">
<input type="hidden" name="unified" id="search-unified" value="{{if .Unified}}1{{else}}0{{end}}" hx-swap-oob="true">
{{template "email-rows" .}}
